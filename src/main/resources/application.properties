spring.application.name=short_video

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION}

# Mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.cloud-key=${CLOUDINARY_API_KEY}
cloudinary.cloud-secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Spring AI - Gemini
spring.ai.openai.api-key=${GOOGLE_API_KEY}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.options.model=gemini-2.5-flash
spring.ai.openai.chat.options.temperature=0.7

# Firebase
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH}

# ZEGOCLOUD
zego.app-id=${ZEGO_APP_ID:280768762}
zego.app-sign=${ZEGO_APP_SIGN:c628b1e73dfbc0e5466c32f2b2fece03758a78b55bf2be50e2330f3248b3677e}
zego.server-secret=${ZEGO_SERVER_SECRET:6c7ec2e8e9956fd60f2b2b14e0fc42f3}

# Springdoc / Swagger OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none

# Python AI Microservice (AI-shortvideo: Recommender & Smart Search)
ai.recommender.url=${AI_RECOMMENDER_URL:http://localhost:5000/api/recommend}
ai.search.url=${AI_SEARCH_URL:http://localhost:5000/api/search}


